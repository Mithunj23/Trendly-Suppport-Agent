<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trendly Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #f2c14e;
    --text: #e8e8ec;
    --muted: #9096a3;
    --bubble-user: #2b2f3a;
    --bubble-bot: #1f2937;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 20px; background: var(--panel); border-bottom: 1px solid #262b36;
    display: flex; align-items: center; gap: 10px;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header span { font-size: 12px; color: var(--muted); margin-left: auto; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 2px; }
  .bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 2px; }
  .trace {
    align-self: flex-start; max-width: 78%; font-size: 11.5px; color: var(--muted);
    background: #12151b; border: 1px dashed #2a2f3a; border-radius: 8px; padding: 6px 10px;
  }
  .trace summary { cursor: pointer; color: var(--accent); }
  #inputRow {
    display: flex; gap: 8px; padding: 14px 20px; background: var(--panel); border-top: 1px solid #262b36;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  #inputRow input {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2f3a;
    background: #0d0f13; color: var(--text); font-size: 14.5px; outline: none;
  }
  #inputRow input:focus { border-color: var(--accent); }
  #inputRow button {
    padding: 0 20px; border-radius: 10px; border: none; background: var(--accent);
    color: #1a1400; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  #inputRow button:disabled { opacity: 0.5; cursor: not-allowed; }
  #suggestions { max-width: 720px; margin: 0 auto; padding: 0 20px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid #2a2f3a;
    color: var(--muted); cursor: pointer; background: transparent;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>Trendly Support Assistant</h1>
    <span id="sessionLabel">connecting…</span>
  </header>
  <div id="chat"></div>
  <div id="suggestions">
    <button class="chip" data-msg="Hi, I'm ananya.rao@example.com, where's my order TR-4521?">Order status</button>
    <button class="chip" data-msg="What's your return policy for footwear?">Policy question</button>
    <button class="chip" data-msg="I want to return TR-4530, item TR-KRT-033, I changed my mind">Return request</button>
    <button class="chip" data-msg="My order TR-4526 never arrived and tracking shows nothing for days">Lost parcel</button>
    <button class="chip" data-msg="Can you give me a discount code since my order is late?">Try a refusal</button>
  </div>
  <div id="inputRow">
    <input id="input" type="text" placeholder="Type a message…" />
    <button id="send">Send</button>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
const sessionLabel = document.getElementById('sessionLabel');

let sessionId = localStorage.getItem('trendly_session_id') || null;
sessionLabel.textContent = sessionId ? 'session active' : 'new session';

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTrace(trace) {
  if (!trace || trace.length === 0) return;
  const details = document.createElement('details');
  details.className = 'trace';
  const summary = document.createElement('summary');
  summary.textContent = `${trace.length} tool call(s) — click to inspect`;
  details.appendChild(summary);
  const pre = document.createElement('pre');
  pre.style.whiteSpace = 'pre-wrap';
  pre.textContent = JSON.stringify(trace, null, 2);
  details.appendChild(pre);
  chat.appendChild(details);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(text) {
  if (!text.trim()) return;
  addMsg(text, 'user');
  input.value = '';
  send.disabled = true;
  addMsg('…', 'bot');
  const thinkingBubble = chat.lastChild;

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: text})
    });
    const data = await res.json();
    sessionId = data.session_id;
    localStorage.setItem('trendly_session_id', sessionId);
    sessionLabel.textContent = 'session ' + sessionId.slice(0, 8);
    thinkingBubble.textContent = data.reply;
    addTrace(data.tool_trace);
  } catch (e) {
    thinkingBubble.textContent = 'Something went wrong reaching the assistant. Please try again.';
  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.addEventListener('click', () => sendMessage(input.value));
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(input.value); });
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => sendMessage(chip.dataset.msg));
});

addMsg("Hi! I'm Trendly's support assistant. I can check order status, answer policy questions, and process eligible returns or exchanges. Could you share the email or phone number on your order to get started?", 'bot');
</script>
</body>
</html>
